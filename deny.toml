# cargo-deny: the guard on everything trust-issues depends on.
# Run `cargo deny check` before every commit that touches Cargo.toml or Cargo.lock.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Check every feature, so a dependency hiding behind a feature flag is checked too.
all-features = true

[advisories]
# Known vulnerabilities (RustSec) always fail. Unmaintained and unsound crates
# fail too, anywhere in the tree; so do yanked versions.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

[licenses]
# Permissive licenses only: anyone may reuse trust_issues's code, including in
# hardware that is sold. Anything not listed here fails, which is what denies
# GPL, LGPL, AGPL, every non-commercial (CC-*-NC) license, and crates with an
# unknown or missing license. MPL-2.0 is file-level copyleft, which is fine.
# Add a license only with a reason in the pull request.
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Public-domain dedication; rust-bitcoin and its sibling crates use it (Max, 2026-11-17)
    "CC0-1.0",
    "ISC",
    "MIT",
    # MIT without the attribution requirement (OSI-approved); needed by borrow-or-share via jsonschema (Max, 2026-11-16)
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93
# hex_lit (via rust-bitcoin) is MIT plus a "no false attribution" clause: still
# permissive. Allowed for that one crate only (Max, 2026-11-17).
exceptions = [{ allow = ["MITNFA"], crate = "hex_lit" }]
# The allow list is a policy, not a census: licenses we don't use yet stay listed.
unused-allowed-license = "allow"
# Test-only crates are checked too. cargo-deny skips them by default because
# they don't ship, but they run on every developer's machine and in CI, and our
# rule is that no GPL or non-commercial code enters the repository at all.
include-dev = true

[bans]
multiple-versions = "warn"
# A `*` version requirement would let any future release in.
wildcards = "deny"
# Except our own crates depending on each other by path inside this workspace.
allow-wildcard-paths = true
deny = [
    # TLS goes through rustls: OpenSSL complicates static, reproducible and ARM builds.
    { crate = "openssl-sys", reason = "use rustls instead" },
    { crate = "openssl", reason = "use rustls instead" },
]

[sources]
# crates.io only: no git dependencies and no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
